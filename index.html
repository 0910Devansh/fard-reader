<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D3A">
<title>Fard Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --green: #1F4D3A; --green-2: #2E6B52; --ink: #1A2420; --muted: #5E6B65;
    --line: #D5DDD8; --mustard: #E3A72F; --mustard-bg: #FFF4D6; --paper: #FFFFFF;
    font-family: system-ui, "Noto Sans", "Noto Sans Gurmukhi", sans-serif;
    color: var(--ink); background: var(--paper);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; line-height: 1.45; font-size: 16px; }
  header { background: var(--green); color: #fff; padding: 14px 18px 16px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header p { margin: 2px 0 0; font-size: 14px; opacity: .85; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  .pick { display: block; width: 100%; padding: 18px; font-size: 18px; font-weight: 700; border: 0; border-radius: 10px;
          background: var(--green); color: #fff; text-align: center; cursor: pointer; }
  .pick:focus-visible, button:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .hint { color: var(--muted); font-size: 14px; margin: 10px 2px 0; }
  .status { margin-top: 18px; }
  .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--green-2); transition: width .3s; }
  .status p { margin: 8px 0 0; font-size: 15px; }
  .summary { margin: 22px 0 8px; font-size: 15px; color: var(--muted); }
  .summary strong { color: var(--ink); }
  .tabs { display: flex; gap: 8px; margin: 14px 0 6px; }
  .tabs button { flex: 1; padding: 10px; font-size: 15px; border: 1px solid var(--green); background: #fff; color: var(--green);
                 border-radius: 8px; font-weight: 600; }
  .tabs button[aria-pressed=true] { background: var(--green); color: #fff; }
  section.khewat { border-top: 3px solid var(--green); margin-top: 22px; padding-top: 8px; }
  .kh-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .kh-head h2 { margin: 0; font-size: 18px; }
  .kh-head .tot { font-size: 15px; color: var(--muted); }
  .kh-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .flag { background: var(--mustard-bg); border-left: 5px solid var(--mustard); padding: 8px 10px; margin: 8px 0; font-size: 14px; }
  .note { font-size: 13px; color: var(--muted); margin: 6px 0; }
  .owner { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .owner .en { font-weight: 650; font-size: 16px; }
  .owner .pa { font-size: 14px; color: var(--muted); grid-column: 1; }
  .owner .land { grid-row: 1 / span 3; grid-column: 2; text-align: right; font-size: 20px; font-weight: 700;
                 font-variant-numeric: tabular-nums; white-space: nowrap; align-self: center; }
  .owner .land small { display: block; font-size: 14px; font-weight: 600; color: var(--muted); }
  .owner .land .unit { font-size: 13px; font-weight: 600; }
  .owner .meta { font-size: 13px; color: var(--muted); grid-column: 1; }
  .actions { display: flex; gap: 10px; margin: 24px 0 40px; flex-wrap: wrap; }
  .actions button { flex: 1; min-width: 150px; padding: 14px; font-size: 16px; font-weight: 700; border-radius: 10px; }
  .primary { background: var(--green); color: #fff; border: 0; }
  .secondary { background: #fff; color: var(--green); border: 2px solid var(--green); }
  /* results table: name column frozen; rows clearly separated; tap highlights a row */
  .hint-inline { font-size: 13px; color: var(--muted); }
  .also { font-size: 13px; color: var(--green-2); }
  .placeline { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tbl-wrap { overflow: auto; max-height: 78vh; margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; -webkit-overflow-scrolling: touch; }
  .tbl { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 14px; }
  .tbl th { position: sticky; top: 0; background: var(--green); color: #fff; text-align: left; padding: 8px 10px; font-weight: 600; white-space: nowrap; z-index: 2; }
  .tbl th.name { left: 0; z-index: 3; }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; background: #fff; }
  .tbl td.name { position: sticky; left: 0; z-index: 1; width: 44vw; max-width: 230px; min-width: 150px;
                 border-right: 2px solid var(--green); }
  .tbl tr.alt td { background: #F3F6F4; }
  .tbl tr.chk td { background: var(--mustard-bg); }
  .tbl tr.sel td { background: #D7EBDF !important; }
  .tbl tr.sel td.name { box-shadow: inset 4px 0 0 var(--green); }
  .tbl .en { font-weight: 650; }
  .tbl .pa { font-size: 13px; color: var(--muted); }
  .tbl .pg { font-size: 12px; color: var(--green-2); font-weight: 600; margin-top: 2px; }
  .tbl td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tbl td.big { font-weight: 700; font-size: 16px; }
  .tbl td.khasra { max-width: 170px; min-width: 120px; font-size: 13px; line-height: 1.5; background: #fff !important; border-left: 1px solid var(--line); }
  .tbl tr.kh-row td { background: #fff; border-top: 3px solid var(--green); padding: 10px 0 6px; }
  .tbl tr.kh-row .stick { position: sticky; left: 0; display: inline-block; max-width: calc(100vw - 48px); padding: 0 10px; }
  .tbl tr.kh-row .flag, .tbl tr.kh-row .note { margin: 6px 0 0; white-space: normal; }
  .update { display: block; width: 100%; border: 0; padding: 12px 16px; background: var(--mustard); color: var(--ink); font-size: 15px; font-weight: 700; cursor: pointer; }
  .tbl .namenote { font-size: 11px; color: var(--mustard-ink, #8a5a00); margin-top: 2px; }
  .tbl td.rel { min-width: 170px; max-width: 260px; font-size: 13px; color: var(--ink); }
  #saved { margin-top: 18px; }
  .saved-h { font-size: 16px; margin: 0 0 8px; }
  #savedList { list-style: none; padding: 0; margin: 0; }
  #savedList li { display: flex; gap: 8px; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; background: #fff; }
  #savedList .link { flex: 1; text-align: left; background: none; border: 0; padding: 10px 12px; font: inherit; color: var(--ink); cursor: pointer; }
  #savedList .link span { font-size: 13px; color: var(--muted); }
  #savedList .del { border: 0; border-left: 1px solid var(--line); background: none; padding: 0 14px; color: #b3261e; font: inherit; cursor: pointer; }
  /* Save / share as PDF: print every table in full */
  @media print {
    header, .pick, #hint, #saved, .actions, .tabs, #update, .hint-inline { display: none !important; }
    #viewKh, #viewPe { display: block !important; }
    #viewPe { break-before: page; }
    .tbl-wrap { overflow: visible !important; max-height: none !important; border: 0; }
    .tbl { width: 100%; font-size: 10px; }
    .tbl th, .tbl td.name, .tbl tr.kh-row .stick { position: static !important; }
    .tbl tr { break-inside: avoid; }
    body { background: #fff; }
  }
  .error { background: #FDECEA; border-left: 5px solid #B3261E; padding: 10px; margin-top: 16px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Fard Reader</h1>
  <p id="offline">Getting ready for offline use. Keep the internet on for the first minute.</p>
</header>
<button id="update" class="update" hidden>A new version is ready. Tap here to update (after the current reading finishes).</button>
<main>
  <label class="pick" id="pickLabel" for="file">Open Fard PDF</label>
  <input type="file" id="file" accept="application/pdf,.pdf">
  <p class="hint" id="hint">Choose the PDF the owner sent you. Nothing is uploaded; the phone reads it.</p>

  <div class="status" id="status" hidden>
    <div class="bar"><i id="barFill"></i></div>
    <p id="statusText">Starting...</p>
  </div>
  <div class="error" id="error" hidden></div>

  <section id="saved" hidden>
    <h2 class="saved-h">Saved results</h2>
    <ul id="savedList"></ul>
  </section>
  <div id="results" hidden>
    <p class="summary" id="summary"></p>
    <div class="tabs" role="group" aria-label="View">
      <button id="tabKh" aria-pressed="true">By khewat</button>
      <button id="tabPe" aria-pressed="false">By person</button>
    </div>
    <div id="viewKh"></div>
    <div id="viewPe" hidden></div>
    <div class="actions">
      <button class="primary" id="print">Save / share as PDF</button>
      <button class="secondary" id="again">Open another PDF</button>
    </div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
